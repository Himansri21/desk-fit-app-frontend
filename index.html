<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lets React without npm</title>
    
    <!-- FIXED: Using straight quotes for the attributes -->
    <script src="./src/index.js" crossorigin></script>
</head>
<body>
    <!-- FIXED: Using straight quotes for the id -->
    <div id="root"></div>

    <script>            
        // This function ensures the script runs only after the whole page is loaded
        window.onload = function() {
            // 1. Define a React Component
            // This is a "class component", a classic way to define a component
            class HelloClass extends React.Component {
                // The render() method is required and must return what you want to display
                render() {
                    // This creates a <div> element with the text "React without npm.." inside
                    return React.createElement("div", null, "React without npm..");
                }
            }

            // 2. Render the Component to the DOM
            // This tells React to take our component and put it inside the HTML element with the id "root"
            ReactDOM.render(
                React.createElement(HelloClass, null, null), // What to render
                document.getElementById("root")              // Where to render it
            );
        };        
    </script>
</body>
</html>
